<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bee Defender</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- START SCREEN -->
  <div id="screen-start" class="screen active">
    <div class="panel">
      <h1 class="title">🐝 Bee Defender</h1>
      <p class="subtitle">Draw barriers. Protect the dog. Survive the swarm.</p>
      <button id="btn-play" class="btn btn-primary">Play</button>
    </div>
  </div>

  <!-- LEVEL INTRO SCREEN -->
  <div id="screen-intro" class="screen">
    <div class="panel">
      <h2 class="title">Level <span id="intro-level-num">1</span></h2>
      <ul class="intro-stats">
        <li>🐝 Bees: <span id="intro-bees"></span></li>
        <li>⏱ Survive: <span id="intro-time"></span></li>
        <li>🖊 Ink: <span id="intro-ink"></span></li>
      </ul>
      <p id="intro-hint" class="hint"></p>
      <button id="btn-begin" class="btn btn-primary">Begin</button>
    </div>
  </div>

  <!-- GAME SCREEN -->
  <div id="screen-game" class="screen">
    <div id="hud">
      <div class="hud-item" id="hud-level">Level 1</div>
      <div class="hud-item hud-bar-wrap">
        <span class="hud-label">Timer</span>
        <div class="hud-bar"><div id="timer-bar-fill" class="hud-bar-fill"></div></div>
        <span id="timer-value" class="hud-value"></span>
      </div>
      <div class="hud-item hud-bar-wrap">
        <span class="hud-label">Ink</span>
        <div class="hud-bar"><div id="ink-bar-fill" class="hud-bar-fill"></div></div>
        <span id="ink-value" class="hud-value"></span>
      </div>
      <div class="hud-item" id="bee-count">🐝 0/0</div>
    </div>
    <div id="canvas-wrap">
      <canvas id="game-canvas" width="800" height="600"></canvas>
    </div>
  </div>

  <!-- RESULT SCREEN -->
  <div id="screen-result" class="screen">
    <div class="panel">
      <h2 id="result-title" class="title"></h2>
      <div id="result-score" class="score-display"></div>
      <p id="result-message"></p>
      <div id="score-submit-form">
        <input id="username-input" type="text" maxlength="20"
               placeholder="Your name" autocomplete="off">
        <button id="btn-submit-score" class="btn">Submit Score</button>
      </div>
      <div class="btn-row">
        <button id="btn-next" class="btn btn-primary">Next Level</button>
        <button id="btn-retry" class="btn">Retry</button>
        <button id="btn-share" class="btn">Share</button>
        <button id="btn-leaderboard" class="btn">Leaderboard</button>
      </div>
    </div>
  </div>

  <!-- LEADERBOARD SCREEN -->
  <div id="screen-leaderboard" class="screen">
    <div class="panel panel-wide">
      <h2 class="title">Leaderboard</h2>
      <div id="leaderboard-loading">Loading…</div>
      <table id="leaderboard-table">
        <thead>
          <tr><th>Rank</th><th>Name</th><th>Score</th><th>Level</th><th>Date</th></tr>
        </thead>
        <tbody id="leaderboard-body"></tbody>
      </table>
      <button id="btn-leaderboard-back" class="btn">Back</button>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toast"></div>

  <script src="/lib/matter.min.js"></script>
  <script>
    const CANVAS_W = 800;
    const CANVAS_H = 600;
  </script>
  <script src="/js/utils.js"></script>
  <script src="/js/level.js"></script>
  <script src="/js/physics.js"></script>
  <script src="/js/bee.js"></script>
  <script src="/js/input.js"></script>
  <script src="/js/renderer.js"></script>
  <script src="/js/leaderboard.js"></script>
  <script src="/js/share.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/game.js"></script>
</body>
</html>
